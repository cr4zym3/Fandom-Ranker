<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fandom Ranker</title>

    <script>
        /*
        ============================================================
        FANDOM RANKER - GITHUB PAGES 404 ROUTER
        ============================================================

        GitHub Pages does not natively support client-side routes.

        Example:

            /Fandom-Ranker/home

        gets sent to this 404.html file.

        This script converts the requested route back into the
        correct Fandom Ranker application URL without losing
        /Fandom-Ranker/.
        ============================================================
        */

        (function () {

            const BASE_PATH = "/Fandom-Ranker";

            const currentPath = window.location.pathname;

            const currentSearch = window.location.search;

            const currentHash = window.location.hash;


            /*
            --------------------------------------------------------
            ONLY HANDLE ROUTES BELONGING TO FANDOM RANKER
            --------------------------------------------------------
            */

            if (
                currentPath === BASE_PATH ||
                currentPath === BASE_PATH + "/" ||
                currentPath.startsWith(BASE_PATH + "/")
            ) {

                /*
                Remove the Fandom-Ranker base path so we can
                determine which internal route was requested.
                */

                let route =
                    currentPath.substring(
                        BASE_PATH.length
                    );


                /*
                Remove leading slash.
                */

                route =
                    route.replace(/^\/+/, "");


                /*
                ----------------------------------------------------
                DEFAULT ROUTE
                ----------------------------------------------------
                */

                if (
                    route === "" ||
                    route === "index.html"
                ) {

                    route = "home";

                }


                /*
                ----------------------------------------------------
                NORMALIZE INDEX.HTML
                ----------------------------------------------------
                */

                route =
                    route.replace(
                        /\/index\.html$/,
                        ""
                    );


                /*
                ----------------------------------------------------
                PROTECT AGAINST DOUBLE BASE PATHS
                ----------------------------------------------------

                This prevents things such as:

                    /Fandom-Ranker/Fandom-Ranker/home
                */

                if (
                    route.startsWith(
                        "Fandom-Ranker/"
                    )
                ) {

                    route =
                        route.substring(
                            "Fandom-Ranker/".length
                        );

                }


                /*
                ----------------------------------------------------
                BUILD CORRECT APPLICATION URL
                ----------------------------------------------------
                */

                const destination =
                    BASE_PATH +
                    "/" +
                    route +
                    currentSearch +
                    currentHash;


                /*
                ----------------------------------------------------
                REDIRECT
                ----------------------------------------------------
                */

                window.location.replace(
                    destination
                );

                return;

            }


            /*
            --------------------------------------------------------
            FALLBACK
            --------------------------------------------------------

            If GitHub somehow sends a completely unrelated path
            here, send the user to the actual Fandom Ranker home.
            --------------------------------------------------------
            */

            window.location.replace(
                BASE_PATH + "/home"
            );

        })();

    </script>

</head>


<body>

    <p>
        Loading Fandom Ranker...
    </p>

    <p>
        If you are not redirected automatically,
        <a href="/Fandom-Ranker/home">
            click here
        </a>.
    </p>

</body>

</html>
