<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fandom Ranker</title>

    <script>

        (function () {

            /*
            ========================================================
            FANDOM RANKER GITHUB PAGES SPA FALLBACK
            ========================================================

            GitHub Pages sends unknown URLs to 404.html.

            Example:

                /Fandom-Ranker/star-wars-movies

            We temporarily send the browser to:

                /Fandom-Ranker/?/star-wars-movies

            index.html then restores the original URL.
            ========================================================
            */

            var l = window.location;

            var base = "/Fandom-Ranker/";

            var path =
                l.pathname.substring(
                    base.length
                );

            var query =
                l.search;

            var hash =
                l.hash;


            /*
            --------------------------------------------------------
            DO NOT REDIRECT IF THIS IS ALREADY THE HOME PAGE
            --------------------------------------------------------
            */

            if (
                path === "" ||
                path === "index.html"
            ) {

                window.location.replace(
                    base
                );

                return;

            }


            /*
            --------------------------------------------------------
            SAVE THE ORIGINAL ROUTE
            --------------------------------------------------------
            */

            var redirectUrl =
                base +
                "?/" +
                path +
                query +
                hash;


            /*
            --------------------------------------------------------
            SEND TO THE REAL INDEX.HTML
            --------------------------------------------------------
            */

            window.location.replace(
                redirectUrl
            );

        })();

    </script>

</head>


<body>

    <p>
        Loading Fandom Ranker...
    </p>

</body>

</html>
