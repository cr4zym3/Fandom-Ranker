<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Fandom Ranker</title>

    <script>

        /*
        ============================================================
        FANDOM RANKER
        GITHUB PAGES 404 ROUTER
        ============================================================

        GitHub Pages project:

        https://cr4zym3.github.io/Fandom-Ranker/

        GitHub Pages does not know about client-side routes such as:

        /Fandom-Ranker/home
        /Fandom-Ranker/star-wars-movies
        /Fandom-Ranker/twice

        When one of those URLs is refreshed, GitHub Pages loads
        this 404.html file.

        This file temporarily converts the route into a query
        string so GitHub Pages serves index.html.

        index.html then restores the clean URL.
        ============================================================
        */


        (function () {

            var location = window.location;

            var basePath = "/Fandom-Ranker/";


            /*
            --------------------------------------------------------
            GET THE PATH AFTER /Fandom-Ranker/
            --------------------------------------------------------
            */

            var path =
                location.pathname.substring(
                    basePath.length
                );


            /*
            --------------------------------------------------------
            GET SEARCH PARAMETERS
            --------------------------------------------------------
            */

            var search =
                location.search;


            /*
            --------------------------------------------------------
            GET HASH
            --------------------------------------------------------
            */

            var hash =
                location.hash;


            /*
            --------------------------------------------------------
            BUILD TEMPORARY URL
            --------------------------------------------------------

            Example:

            /Fandom-Ranker/star-wars-movies

            becomes:

            /Fandom-Ranker/?/star-wars-movies
            --------------------------------------------------------
            */


            var redirectUrl =
                basePath +
                "?/" +
                path;


            /*
            --------------------------------------------------------
            PRESERVE QUERY PARAMETERS
            --------------------------------------------------------
            */

            if (
                search &&
                search.length > 0
            ) {

                redirectUrl +=
                    "&" +
                    search.substring(1);

            }


            /*
            --------------------------------------------------------
            PRESERVE HASH
            --------------------------------------------------------
            */

            if (
                hash &&
                hash.length > 0
            ) {

                redirectUrl +=
                    hash;

            }


            /*
            --------------------------------------------------------
            REDIRECT TO INDEX.HTML
            --------------------------------------------------------
            */

            window.location.replace(
                redirectUrl
            );

        })();

    </script>

</head>


<body>

    <p>
        Loading Fandom Ranker...
    </p>

</body>

</html>
