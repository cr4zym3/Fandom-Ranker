<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Fandom Ranker</title>

    <!--
    ============================================================
    FANDOM RANKER
    GITHUB PAGES SPA 404 ROUTER
    ============================================================

    GitHub Pages project:

    https://cr4zym3.github.io/Fandom-Ranker/

    GitHub Pages does not natively understand client-side
    routes such as:

        /Fandom-Ranker/home
        /Fandom-Ranker/twice
        /Fandom-Ranker/star-wars-movies
        /Fandom-Ranker/star-wars-movies/results

    When one of those URLs is refreshed, GitHub Pages sends
    the request to this 404.html file.

    This script converts the requested route into a temporary
    query-string URL:

        /Fandom-Ranker/?/star-wars-movies

    The normal index.html then restores the clean URL before
    app.js starts.

    ============================================================
    -->

    <script>

        (function () {

            /*
            ----------------------------------------------------
            IMPORTANT
            ----------------------------------------------------

            This MUST match the GitHub Pages repository name.

                https://cr4zym3.github.io/Fandom-Ranker/

            Therefore:

                /Fandom-Ranker/
            */

            var BASE_PATH =
                "/Fandom-Ranker/";


            /*
            ----------------------------------------------------
            CURRENT REQUEST
            ----------------------------------------------------
            */

            var currentPath =
                window.location.pathname;


            var currentSearch =
                window.location.search;


            var currentHash =
                window.location.hash;


            /*
            ----------------------------------------------------
            FIND THE ROUTE
            ----------------------------------------------------

            Example:

                /Fandom-Ranker/star-wars-movies

            becomes:

                star-wars-movies
            */

            var route =
                currentPath;


            if (
                route.indexOf(BASE_PATH) === 0
            ) {

                route =
                    route.substring(
                        BASE_PATH.length
                    );

            }


            /*
            ----------------------------------------------------
            CLEAN ROUTE
            ----------------------------------------------------
            */

            route =
                route.replace(
                    /^\/+/,
                    ""
                );


            route =
                route.replace(
                    /\/+$/,
                    ""
                );


            /*
            ----------------------------------------------------
            IF THERE IS NO ROUTE
            ----------------------------------------------------

            This normally should not happen for a 404 page,
            but safely send it to home.
            */

            if (!route) {

                route =
                    "home";

            }


            /*
            ----------------------------------------------------
            PRESERVE QUERY PARAMETERS
            ----------------------------------------------------

            If the original URL was something like:

                /Fandom-Ranker/twice?foo=bar

            we preserve the query string.

            The special ?/route format lets index.html
            distinguish the routing information from normal
            query parameters.
            */

            var redirectUrl =
                BASE_PATH +
                "?/" +
                route;


            /*
            ----------------------------------------------------
            PRESERVE ORIGINAL QUERY PARAMETERS
            ----------------------------------------------------
            */

            if (
                currentSearch &&
                currentSearch !== "?"
            ) {

                /*
                Remove the leading ? because the special route
                query already begins with ?/
                */

                var extraQuery =
                    currentSearch.substring(1);


                if (extraQuery) {

                    redirectUrl +=
                        "&" +
                        extraQuery;

                }

            }


            /*
            ----------------------------------------------------
            PRESERVE HASH
            ----------------------------------------------------
            */

            if (
                currentHash
            ) {

                redirectUrl +=
                    currentHash;

            }


            /*
            ----------------------------------------------------
            REDIRECT
            ----------------------------------------------------

            Example:

                Original:

                /Fandom-Ranker/star-wars-movies

                Temporary:

                /Fandom-Ranker/?/star-wars-movies

            index.html will then restore:

                /Fandom-Ranker/star-wars-movies
            */

            window.location.replace(
                redirectUrl
            );

        })();

    </script>

</head>


<body>

    <!--
        This page normally redirects immediately.

        The message is only visible for the very brief moment
        before the browser processes the redirect.
    -->

    <main
        style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#111827;
            color:white;
            font-family:Arial,sans-serif;
            text-align:center;
        "
    >

        <div>

            <h1>
                Fandom Ranker
            </h1>

            <p>
                Loading...
            </p>

        </div>

    </main>

</body>

</html>
