<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fandom Ranker</title>

</head>


<body>

<script>

(function () {

    const BASE_PATH = "/Fandom-Ranker";

    const pathname =
        window.location.pathname;

    const search =
        window.location.search;


    /*
        Remove the repository path.
    */

    let route =
        pathname;


    if (
        route.startsWith(
            BASE_PATH
        )
    ) {

        route =
            route.substring(
                BASE_PATH.length
            );

    }


    /*
        Remove leading/trailing slashes.
    */

    route =
        route
            .replace(/^\/+/, "")
            .replace(/\/+$/, "");


    /*
        If GitHub sent us to 404.html because of an
        application route, send that route back to the
        application's index.

        Example:

        /Fandom-Ranker/star-wars-movies

        becomes temporarily:

        /Fandom-Ranker/?route=star-wars-movies

        app.js then restores the clean URL.
    */

    const target =
        BASE_PATH +
        "/?route=" +
        encodeURIComponent(
            route || "home"
        );


    window.location.replace(
        target
    );

})();

</script>

</body>

</html>
